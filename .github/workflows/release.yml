name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: package tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Verify tag and plugin version
        run: python scripts/check_release_tag.py "$RELEASE_TAG"

      - name: Run repository checks
        run: make check

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.247

      - name: Run official plugin validation
        run: claude plugin validate . --strict

      - name: Build release archive and checksum
        run: |
          make package
          version="${RELEASE_TAG#v}"
          artifact="endgame-plugin-${version}.zip"
          cd dist
          sha256sum "$artifact" > "$artifact.sha256"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          artifact="dist/endgame-plugin-${version}.zip"
          checksum="${artifact}.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$artifact" "$checksum" --clobber
          else
            gh release create "$RELEASE_TAG" "$artifact" "$checksum" \
              --verify-tag \
              --generate-notes \
              --title "Endgame plugin $RELEASE_TAG"
          fi
